services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskflow_db
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before running docker compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  taskflow_data:
