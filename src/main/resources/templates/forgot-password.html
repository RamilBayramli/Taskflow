<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Восстановление пароля')}"></head>
  <body class="auth-body auth-compact">
    <main class="auth-main">
      <a class="brand auth-mobile-brand" href="/login">
        <img src="/icons/logo.svg" width="32" height="32" alt="" />TaskFlow
      </a>
      <div class="auth-form-wrap">
        <h1>Забыли пароль?</h1>
        <p class="auth-intro">Укажите почту аккаунта, чтобы получить код для смены пароля.</p>
        <div class="flash error" th:unless="${mailConfigured}" role="status">
          Отправка писем недоступна. Настройте почту на сервере TaskFlow.
        </div>
        <form class="stack-form" th:if="${mailConfigured}" th:action="@{/forgot-password}" th:object="${emailForm}" method="post">
          <div class="form-errors" th:if="${#fields.hasAnyErrors()}" role="alert">
            <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
          </div>
          <label>Email
            <input th:field="*{email}" type="email" autocomplete="email" required maxlength="254" />
          </label>
          <button type="submit" class="button primary auth-submit">Получить код<i data-lucide="arrow-right"></i></button>
        </form>
        <div class="auth-links">
          <a href="/reset-password">У меня есть код</a>
          <a href="/login">Ко входу</a>
        </div>
      </div>
    </main>
  </body>
</html>
