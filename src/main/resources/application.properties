spring.application.name=TaskFlow
spring.config.import=optional:file:./.taskflow/mail.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow_db}
spring.datasource.username=${DB_USERNAME:taskflow}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=true
server.port=${PORT:8080}
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.web.resources.cache.cachecontrol.no-cache=true
taskflow.zone=${APP_TIMEZONE:Asia/Baku}
spring.web.locale=ru_RU
spring.web.locale-resolver=fixed

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
taskflow.mail.from=${SMTP_FROM:${spring.mail.username:}}
